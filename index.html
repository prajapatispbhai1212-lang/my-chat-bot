
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-container {
    width: 100%;
    max-width: 850px;
    height: 95vh;
    background: #192231;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #344054;
}

.header {
    padding: 20px;
    background: #202d40;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    color: #54d6bb;
}

.header button {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #087f70;
    align-self: flex-end;
}

.bot {
    background: #303d50;
    align-self: flex-start;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 18px;
    background: #202d40;
}

.input-area input {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.input-area button {
    padding: 0 23px;
    border: none;
    background: #54d6bb;
    color: #101522;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
}

.input-area button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.typing {
    color: #54d6bb;
    font-size: 13px;
    padding: 0 20px 10px;
}

@media(max-width: 600px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 My AI Chatbot</h2>
        <button onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            Hello! 👋 Welcome to My AI Chatbot.
            How can I help you today?
        </div>

    </div>

    <div class="typing" id="typing"></div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send ➤
        </button>

    </div>

</div>

<script>

// Your backend API endpoint
const API_URL = "/api/chat";

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const typing = document.getElementById("typing");
const sendButton = document.getElementById("sendButton");

let conversation = [];

function addMessage(message, sender) {

    const div = document.createElement("div");

    div.className = "message " + sender;
    div.textContent = message;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const message = userInput.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage(message, "user");

    userInput.value = "";

    conversation.push({
        role: "user",
        content: message
    });

    typing.textContent = "AI is typing...";

    sendButton.disabled = true;

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: conversation
            })

        });

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        const reply = data.reply;

        if (typeof reply !== "string") {
            throw new Error("Invalid AI response");
        }

        addMessage(reply, "bot");

        conversation.push({
            role: "assistant",
            content: reply
        });

    } catch (error) {

        addMessage(
            "Sorry! I cannot connect to the AI server. Please try again later.",
            "bot"
        );

    } finally {

        typing.textContent = "";
        sendButton.disabled = false;
        userInput.focus();

    }
}

function clearChat() {

    chatBox.innerHTML = "";

    conversation = [];

    addMessage(
        "Hello! 👋 Welcome back. How can I help you?",
        "bot"
    );

}

userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
